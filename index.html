<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Toxic Chemical Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
    :root {
      --bg: #F4F3EE; --surface: #FFFFFF; --surface2: #ECEAE3; --surface3: #E2E0D7;
      --text: #17171A; --text-mid: #3D3D42; --text-muted: #7A7A82;
      --accent: #1A3A5C; --accent-light: #E8EEF5; --accent-mid: #A8BDD4;
      --teal: #2D7D6A; --teal-light: #E3F2EE; --teal-mid: #A5CECA;
      --danger: #B5320A; --danger-light: #FBF0EC; --danger-border: #E8C4B0;
      --warn: #8A5C0A; --warn-light: #FBF4E8; --warn-border: #E0C88A;
      --border: #D8D6CE; --border-strong: #B8B6AE;
      --alt-bg: #EEF7E8; --alt-border: #C8E4B0; --alt-text: #1F5010; --alt-source-bg: #F5FBF0;
      --mono: 'IBM Plex Mono', monospace; --serif: 'IBM Plex Serif', Georgia, serif;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shimmer { 0% { left:-60%; } 100% { left:120%; } }
    .fade-up { animation: fadeUp 0.3s ease forwards; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    #app-shell { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ── Header ── */
    .app-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 0 16px; border-bottom:1px solid var(--border);
    }
    .logo { display:flex; align-items:center; gap:12px; cursor:pointer; border:none; background:none; padding:0; }
    .logo-mark {
      width:36px; height:36px; border-radius:10px; background:var(--accent);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .logo-name { font-size:17px; font-weight:600; color:var(--text); letter-spacing:-0.3px; }
    .logo-sub { font-size:11px; color:var(--text-muted); font-family:var(--mono); }
    .back-btn {
      font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:500;
      color:var(--accent); background:var(--accent-light); border:1px solid var(--accent-mid);
      border-radius:8px; padding:7px 14px; cursor:pointer; white-space:nowrap;
    }

    /* ── Search Hero ── */
    .search-hero { padding:52px 0 40px; text-align:center; }
    .hero-title {
      font-family:var(--serif); font-size:34px; font-weight:600;
      color:var(--text); line-height:1.2; margin-bottom:10px; letter-spacing:-0.5px;
    }
    .hero-sub {
      font-size:15px; color:var(--text-mid); line-height:1.65;
      max-width:500px; margin:0 auto 30px;
    }
    .search-wrap { position:relative; max-width:580px; margin:0 auto; }
    .search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none; }
    .search-input {
      width:100%; padding:14px 100px 14px 46px;
      font-family:'IBM Plex Sans',sans-serif; font-size:15px;
      border:2px solid var(--border); border-radius:14px;
      background:var(--surface); color:var(--text); outline:none;
      box-shadow:0 2px 12px rgba(0,0,0,0.06); transition:border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus { border-color:var(--accent); box-shadow:0 2px 20px rgba(26,58,92,0.12); }
    .search-input::placeholder { color:var(--text-muted); }
    .search-btn {
      position:absolute; right:7px; top:50%; transform:translateY(-50%);
      background:var(--accent); color:#fff; border:none; border-radius:9px;
      padding:8px 18px; font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:500;
      cursor:pointer; transition:background 0.15s;
    }
    .search-btn:hover { background:#142e4a; }
    .autocomplete {
      position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:50;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      box-shadow:0 8px 32px rgba(0,0,0,0.10); overflow:hidden; max-height:280px; overflow-y:auto;
    }
    .autocomplete-item {
      display:flex; align-items:center; gap:10px; padding:11px 16px; cursor:pointer;
      border-bottom:1px solid var(--surface2); transition:background 0.1s;
    }
    .autocomplete-item:last-child { border-bottom:none; }
    .autocomplete-item:hover { background:var(--surface2); }
    .ac-name { font-size:14px; font-weight:500; color:var(--text); }
    .ac-aka { font-size:11px; color:var(--text-muted); font-family:var(--mono); }

    /* Quick access */
    .quick-wrap { max-width:580px; margin:22px auto 0; text-align:center; }
    .quick-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:10px; font-family:var(--mono); }
    .chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
    .chip {
      font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:500;
      padding:6px 14px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface); color:var(--text-mid); cursor:pointer; transition:all 0.15s;
    }
    .chip:hover { background:var(--accent-light); border-color:var(--accent-mid); color:var(--accent); }

    /* Stats */
    .stats-bar {
      display:flex; align-items:center; justify-content:center; gap:40px;
      margin-top:40px; padding:20px 0; border-top:1px solid var(--border);
    }
    .stat-num { display:block; font-family:var(--mono); font-size:24px; font-weight:600; color:var(--accent); }
    .stat-lbl { font-size:11px; color:var(--text-muted); margin-top:2px; }

    /* ── Detail Layout ── */
    .detail-layout {
      display:grid; grid-template-columns:268px 1fr;
      align-items:start; min-height:calc(100vh - 72px);
    }

    /* Sidebar */
    .sidebar {
      border-right:1px solid var(--border); padding:28px 22px;
      position:sticky; top:0; height:calc(100vh - 72px); overflow-y:auto;
      display:flex; flex-direction:column; gap:18px;
    }
    .sb-name { font-family:var(--serif); font-size:20px; font-weight:600; line-height:1.2; color:var(--text); }
    .sb-aka { font-size:11px; color:var(--text-muted); font-family:var(--mono); margin-top:4px; line-height:1.5; }
    .sb-cas { display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:4px; background:var(--surface2); color:var(--text-mid); margin-top:6px; }
    .sb-divider { height:1px; background:var(--border); }
    .sb-section-lbl { font-family:var(--mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:6px; }

    /* GreenScreen big badge */
    .gs-big { border-radius:12px; padding:14px 16px; }
    .gs-lbl { font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; opacity:.7; }
    .gs-title { font-family:'IBM Plex Sans',sans-serif; font-size:16px; font-weight:700; line-height:1.1; margin:4px 0; }
    .gs-pips { display:flex; gap:4px; margin-top:6px; }
    .gs-pip { height:5px; flex:1; border-radius:3px; }

    /* Reg badges */
    .reg-badge {
      display:flex; align-items:center; gap:7px; padding:6px 10px; border-radius:8px;
      font-family:'IBM Plex Sans',sans-serif; font-size:11px; font-weight:600;
      text-decoration:none; transition:filter 0.15s; margin-bottom:5px;
    }
    .reg-badge:hover { filter:brightness(0.95); }
    .reg-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

    /* Section nav */
    .nav-btn {
      width:100%; text-align:left; font-family:'IBM Plex Sans',sans-serif; font-size:12px;
      color:var(--text-muted); padding:5px 8px; border-radius:6px; cursor:pointer;
      border:none; background:none; transition:all 0.12s; display:block;
    }
    .nav-btn:hover { color:var(--accent); background:var(--accent-light); }

    /* Related chips */
    .related-chip {
      font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:7px;
      border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
      cursor:default; transition:all 0.12s;
    }
    .related-chip.link { color:var(--accent); border-color:var(--accent-mid); cursor:pointer; }
    .related-chip.link:hover { background:var(--accent-light); }

    /* ── Main ── */
    .main { padding:32px 36px 56px; }
    .section { margin-bottom:36px; }
    .section-hd { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .section-lbl { font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); white-space:nowrap; }
    .section-line { flex:1; height:1px; background:var(--border); }
    .body-text { font-size:15px; line-height:1.75; color:var(--text-mid); }

    /* Chem class pill */
    .class-pill { display:inline-block; padding:3px 12px; border-radius:6px; font-size:12px; font-weight:600; background:var(--accent-light); color:var(--accent); font-family:var(--mono); margin-bottom:8px; }

    /* Animated molecule */
    .mol-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .mol-formula { text-align:center; padding:8px 12px 12px; font-family:var(--mono); font-size:11px; color:var(--text-muted); border-top:1px solid var(--border); background:var(--surface2); }

    /* Hazard rows */
    .hazard-list { display:flex; flex-direction:column; gap:8px; }
    .hazard-row {
      display:flex; flex-direction:column;
      gap:6px; padding:12px 14px 12px 16px;
      background:var(--surface); border:1px solid var(--border); border-radius:10px;
      position:relative;
    }
    .hz-header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .hz-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; font-family:var(--mono); }
    .hz-text { font-size:13px; line-height:1.6; color:var(--text-mid); }
    .hz-pips { display:flex; gap:3px; align-items:center; flex-shrink:0; }
    .hz-pip { width:8px; height:8px; border-radius:2px; }

    /* GreenScreen detail box */
    .gs-detail { border-radius:10px; padding:14px 18px; }
    .gs-detail p { font-size:14px; line-height:1.7; color:var(--text-mid); }
    .gs-detail a { display:inline-block; margin-top:8px; font-size:12px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-mid); }

    /* Products */
    .prod-legend {
      display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; padding:8px 12px;
      background:var(--surface2); border-radius:8px; border:1px solid var(--border);
      font-family:var(--mono); font-size:11px; color:var(--text-muted); align-items:center;
    }
    .prod-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .prod-chip { font-family:'IBM Plex Sans',sans-serif; font-size:12px; padding:4px 10px; border-radius:6px; }

    /* Manufacturers */
    .mfr-table { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .mfr-row { display:grid; grid-template-columns:160px 1fr; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); align-items:flex-start; }
    .mfr-row:last-child { border-bottom:none; }
    .mfr-name { font-size:13px; font-weight:600; color:var(--text); font-family:var(--mono); }
    .mfr-note { font-size:12.5px; line-height:1.5; color:var(--text-mid); }
    .mfr-links { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; border-top:1px solid var(--border); background:var(--surface2); }
    .ext-link {
      font-family:'IBM Plex Sans',sans-serif; font-size:11px; font-weight:500;
      padding:5px 12px; border-radius:6px; text-decoration:none; transition:all 0.12s;
      border:1px solid var(--border); color:var(--text-muted); background:var(--surface);
    }
    .ext-link:hover { color:var(--accent); border-color:var(--accent-mid); }
    .ext-link.primary { background:var(--accent-light); color:var(--accent); border-color:var(--accent-mid); }

    /* Alternatives */
    .alt-table { background:var(--alt-bg); border:1px solid var(--alt-border); border-radius:12px; overflow:hidden; }
    .alt-row { display:grid; grid-template-columns:130px 1fr; gap:12px; padding:11px 16px; border-bottom:1px solid var(--alt-border); align-items:flex-start; }
    .alt-row:last-child { border-bottom:none; }
    .alt-ctx { display:flex; align-items:flex-start; gap:5px; font-size:12px; font-weight:600; color:var(--alt-text); font-family:var(--mono); }
    .alt-name { font-size:13px; font-weight:500; color:var(--text); }
    .alt-note { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
    .alt-source { padding:8px 16px; border-top:1px solid var(--alt-border); background:var(--alt-source-bg); font-size:11px; color:var(--text-muted); font-family:var(--mono); }

    /* Legislation */
    .leg-filters { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .leg-filter {
      font-family:var(--mono); font-size:11px; font-weight:600; padding:5px 12px;
      border-radius:6px; cursor:pointer; border:1px solid var(--border);
      background:var(--surface); color:var(--text-muted); transition:all 0.12s;
    }
    .leg-filter.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .leg-list { display:flex; flex-direction:column; gap:7px; }
    .leg-item { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--border); }
    .leg-state { font-family:var(--mono); font-size:11px; font-weight:600; padding:3px 6px; border-radius:5px; flex-shrink:0; min-width:34px; text-align:center; margin-top:1px; }
    .leg-bill { font-family:var(--mono); font-size:12px; font-weight:500; color:var(--text); }
    .leg-status { font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; padding:2px 7px; border-radius:4px; }
    .leg-title { font-size:13px; line-height:1.45; color:var(--text-mid); margin-top:2px; }
    .leg-ext { display:flex; flex-wrap:wrap; gap:6px; padding-top:10px; }

    /* Map */
    .map-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
    .map-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); }
    .map-title { font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); }
    .map-svg { width:100%; height:auto; display:block; }
    .map-legend { display:flex; gap:14px; padding:8px 14px; border-top:1px solid var(--border); background:var(--surface2); }
    .map-legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-muted); font-family:var(--mono); }
    .map-swatch { width:10px; height:10px; border-radius:3px; }

    /* Two-col */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:0; }

    /* AI warning */
    .ai-warn { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:8px; background:var(--warn-light); border:1px solid var(--warn-border); font-size:12px; color:var(--warn); margin-bottom:20px; }

    /* Loading */
    .loading { text-align:center; padding:72px 24px; }
    .loading-bar { width:48px; height:3px; background:var(--accent-light); border-radius:2px; margin:20px auto 0; overflow:hidden; position:relative; }
    .loading-bar::after { content:''; position:absolute; left:-60%; top:0; width:60%; height:100%; background:var(--accent); border-radius:2px; animation:shimmer 1.2s ease-in-out infinite; }

    .error-box { text-align:center; padding:40px 24px; background:var(--danger-light); border:1px solid var(--danger-border); border-radius:12px; }

    /* Footer */
    .footer { padding:20px 0 28px; margin-top:8px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); text-align:center; line-height:1.8; font-family:var(--mono); }
    .footer a { color:var(--accent); text-decoration:none; }

    @media (max-width:820px) {
      .detail-layout { grid-template-columns:1fr; }
      .sidebar { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
      .two-col { grid-template-columns:1fr; gap:16px; }
      .hazard-row { }
      .mfr-row { grid-template-columns:1fr; }
      .alt-row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<!-- Chemical database -->
<script src="chemicals.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Tweaks panel (inlined) ─────────────────────────────────────
const TWEAKS_CSS = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:9999;width:280px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.9);color:#29261b;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 'IBM Plex Sans',sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none;border-bottom:1px solid rgba(0,0,0,.08)}
  .twk-hd b{font-size:12px;font-weight:600}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.5);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:22px;text-align:center}
  .twk-x:hover{background:rgba(0,0,0,.08)}
  .twk-body{padding:8px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:6px 0 0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;border-radius:999px;background:rgba(0,0,0,.12);outline:none;margin:4px 0}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.15);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:pointer;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return { tweaks: values, setTweak };
}

function TweaksPanel({ children }) {
  const [open, setOpen] = useState(false);
  const panelRef = useRef(null);
  useEffect(() => {
    const handler = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <>
      <style>{TWEAKS_CSS}</style>
      <div ref={panelRef} className="twk-panel">
        <div className="twk-hd"><b>Tweaks</b><button className="twk-x" onClick={dismiss}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ title }) { return <div className="twk-sect">{title}</div>; }
function TweakSlider({ id, label, value, min, max, step, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span><span className="twk-val">{value}</span></div>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} />
    </div>
  );
}
function TweakToggle({ id, label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <span style={{fontWeight:500,color:'rgba(41,38,27,.72)'}}>{label}</span>
      <button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={() => onChange(!value)}><i/></button>
    </div>
  );
}
function TweakRadio({ id, label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span style={{fontWeight:500,color:'rgba(41,38,27,.72)'}}>{label}</span></div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }}/>
        {opts.map(o => (
          <button key={o.value} type="button" onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

// ── Animated Molecule ──────────────────────────────────────────
function AnimatedMolecule({ structure, width=250, height=180 }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const angleRef = useRef(0);

  useEffect(() => {
    if (!canvasRef.current || !structure) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    const EL_COLORS = { C:"#2C2C2C",O:"#C94040",N:"#2060A8",Cl:"#18805A",F:"#B05A20",H:"#AAAAAA",Si:"#6A5ABB",S:"#AA7010","◯":"#888" };
    const getColor = el => EL_COLORS[el.replace(/[^A-Za-z◯]/g,"")] || "#666";

    // Detect dark mode from CSS var
    const isDark = () => getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#1') || getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#0');

    function draw(angle) {
      const dark = isDark();
      const bondColor = dark ? "rgba(220,218,210,0.35)" : "rgba(60,60,56,0.2)";
      const atomBg = dark ? "#2A2C34" : "#FAFAF8";
      const labelColor = dark ? "#9A9A94" : "#9A9A94";

      ctx.clearRect(0,0,width,height);
      const pad=30, W=width-pad*2, H=height-pad*2;
      const tx=r=>pad+r*W, ty=r=>pad+r*H;
      const wobble = Math.sin(angle)*0.035;
      const py = y => y + wobble*(y-0.5)*0.4;
      const { atoms=[], bonds=[], fAtoms, extras, polymer, label:sLabel } = structure;

      // Bonds
      ctx.lineWidth=1.8;
      bonds.forEach(b => {
        const a1=atoms[b.a],a2=atoms[b.b]; if(!a1||!a2) return;
        const x1=tx(a1.x),y1=ty(py(a1.y)),x2=tx(a2.x),y2=ty(py(a2.y));
        ctx.strokeStyle=bondColor;
        if (b.o===2) {
          const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
          const nx=-dy/len*3,ny=dx/len*3;
          ctx.beginPath(); ctx.moveTo(x1+nx,y1+ny); ctx.lineTo(x2+nx,y2+ny); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x1-nx,y1-ny); ctx.lineTo(x2-nx,y2-ny); ctx.stroke();
        } else { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
      });
      // fAtoms (PFAS-style)
      if (fAtoms) {
        fAtoms.forEach((f,i)=>{ const p=atoms[Math.floor(i/2)]; if(!p) return; ctx.strokeStyle=bondColor; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(tx(p.x),ty(py(p.y))); ctx.lineTo(tx(f.x),ty(py(f.y))); ctx.stroke(); });
        fAtoms.forEach(f=>{ ctx.fillStyle=atomBg; ctx.beginPath(); ctx.arc(tx(f.x),ty(py(f.y)),11,0,Math.PI*2); ctx.fill(); ctx.fillStyle=getColor(f.el); ctx.font="500 10px 'IBM Plex Mono',monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(f.el,tx(f.x),ty(py(f.y))); });
      }
      // Extras
      if (extras) {
        extras.forEach(e=>{ const p=atoms[e.from]; if(!p) return; ctx.strokeStyle=bondColor; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(tx(p.x),ty(py(p.y))); ctx.lineTo(tx(e.x),ty(py(e.y))); ctx.stroke(); const r=e.el.length>2?18:12; ctx.fillStyle=atomBg; ctx.beginPath(); ctx.arc(tx(e.x),ty(py(e.y)),r,0,Math.PI*2); ctx.fill(); ctx.fillStyle=getColor(e.el); ctx.font=`500 ${r>12?9:10}px 'IBM Plex Mono',monospace`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(e.el,tx(e.x),ty(py(e.y))); });
      }
      // Polymer
      if (polymer) { ctx.strokeStyle=bondColor; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.strokeRect(tx(0.08),ty(0.06),tx(0.75)-tx(0.08),ty(0.82)-ty(0.06)); ctx.setLineDash([]); ctx.fillStyle=dark?"#888":"#999"; ctx.font="italic 12px 'IBM Plex Mono',monospace"; ctx.textAlign="left"; ctx.fillText("n",tx(0.78),ty(0.80)); }
      // Atoms
      atoms.forEach(a => {
        const px2=tx(a.x),py2=ty(py(a.y)),el=a.el;
        const r=el.length>2?18:el==="◯"?14:13;
        ctx.save(); ctx.shadowColor=dark?"rgba(0,0,0,0.4)":"rgba(0,0,0,0.09)"; ctx.shadowBlur=5; ctx.shadowOffsetY=2;
        ctx.fillStyle=atomBg; ctx.beginPath(); ctx.arc(px2,py2,r,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.strokeStyle=getColor(el)+(dark?"60":"40"); ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(px2,py2,r,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle=getColor(el);
        ctx.font=`600 ${el.length>2?8:10}px 'IBM Plex Mono',monospace`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(el,px2,py2);
      });
      if (sLabel) { ctx.fillStyle=labelColor; ctx.font="10px 'IBM Plex Sans',sans-serif"; ctx.textAlign="center"; ctx.fillText(sLabel,width/2,height-8); }
    }

    function animate() { angleRef.current += 0.007; draw(angleRef.current); rafRef.current = requestAnimationFrame(animate); }
    animate();
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [structure, width, height]);

  if (!structure) return <div style={{color:"var(--text-muted)",fontSize:13,textAlign:"center",padding:"2rem"}}>Structure not available</div>;
  return <canvas ref={canvasRef} style={{width,height,display:"block",margin:"0 auto"}} />;
}

// ── Hazard row with severity pips ──────────────────────────────
function HazardRow({ label, val }) {
  const isHuman = !/ecolog|aquatic|wildlife|environ/i.test(label);
  const color = isHuman ? "var(--danger)" : "var(--teal)";
  const sev = /cancer|carcinogen|known human carcinogen/i.test(val) ? 5
    : /iarc group 1|parkinson|reproductive toxicit/i.test(val) ? 4
    : /endocrine|organ damage|immune/i.test(val) ? 3
    : /bioaccumul|persist|aquatic/i.test(val) ? 3 : 2;
  return (
    <div className="hazard-row" style={{borderLeft:`3px solid ${color}`}}>
      <div className="hz-header">
        <div className="hz-label" style={{color}}>{label}</div>
        <div className="hz-pips" title={`Severity ${sev}/5`}>
          {[1,2,3,4,5].map(i => (
            <div key={i} className="hz-pip" style={{ background: i<=sev ? color : "var(--border)", opacity: i<=sev ? 0.3+i*0.14 : 0.35 }} />
          ))}
        </div>
      </div>
      <div className="hz-text">{val}</div>
    </div>
  );
}

function USLegMap({ legislation }) {
  const [hovered, setHovered] = useState(null);
  const [view, setView] = useState("us");

  const coverage = useMemo(() => {
    const m = {};
    (legislation||[]).forEach(l => {
      if (!l.st) return;
      if (!m[l.st]) m[l.st]={passed:0,proposed:0};
      if (l.status==="passed") m[l.st].passed++;
      else m[l.st].proposed++;
    });
    return m;
  }, [legislation]);

  const fedBills = (legislation||[]).filter(l=>l.st==="US");
  const euBills  = (legislation||[]).filter(l=>l.st==="EU");

  const getFill   = st => { const d=coverage[st]; if(!d) return "var(--surface2)"; return d.passed>0?"#B8DDA0":"#FDE8CC"; };
  const getStroke = st => { const d=coverage[st]; if(!d) return "var(--border)";   return d.passed>0?"#5A9A30":"#C8A840"; };

  const fedColor  = fedBills.some(b=>b.status==="passed") ? "#5A9A30" : fedBills.length>0 ? "#C8A840" : null;

            ))}

          {fedBills.filter(b=>b.status==="proposed").length>0&&<span style={{fontFamily:"var(--mono)",fontSize:10,background:"var(--warn-light)",color:"var(--warn)",padding:"2px 8px",borderRadius:4,border:"1px solid var(--warn-border)"}}>{fedBills.filter(b=>b.status==="proposed").length} federal proposed</span>}
        </div>

        ) : (
          <svg viewBox="380 60 260 270" className="map-svg" style={{maxHeight:256}}>
            {euBills.length>0&&<text x="510" y="80" textAnchor="middle" fontSize="9" fontFamily="'IBM Plex Mono',monospace" fill={euBills.some(b=>b.status==="passed")?"#27500A":"#7A4A0B"} fontWeight="600">EU: {euBills.filter(b=>b.status==="passed").length} passed · {euBills.filter(b=>b.status==="proposed").length} proposed</text>}
            {Object.entries(EU_COUNTRIES).map(([cc,{d,cx,cy,name}])=>{
              const isHov=hovered===cc;
              const euFill   = euBills.some(b=>b.status==="passed")?"#B8DDA0":euBills.some(b=>b.status==="proposed")?"#FDE8CC":"var(--surface2)";
              const euStroke = euBills.some(b=>b.status==="passed")?"#5A9A30":euBills.some(b=>b.status==="proposed")?"#C8A840":"var(--border)";
              return (
                <g key={cc} onMouseEnter={()=>setHovered(cc)} onMouseLeave={()=>setHovered(null)}>
                  <path d={d} fill={isHov?"#B8D4F0":euFill} stroke={isHov?"var(--accent)":euStroke} strokeWidth={isHov?1.5:0.7} style={{transition:"fill 0.15s",cursor:"default"}}/>
                  <text x={cx} y={cy+3} textAnchor="middle" fontSize="7" fontFamily="'IBM Plex Mono',monospace" fontWeight="600" fill={euBills.some(b=>b.status==="passed")?"#27500A":"#7A4A0B"} pointerEvents="none">{cc}</text>
                  <title>{name}{euBills.length>0?" — EU regulation applies":""}</title>
                </g>
              );
            })}
          </svg>
        )}

        {hovered&&(coverage[hovered]||EU_COUNTRIES[hovered])&&(
          <div style={{position:"absolute",bottom:12,left:12,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 12px",fontFamily:"var(--mono)",fontSize:11,boxShadow:"0 2px 12px rgba(0,0,0,.1)",pointerEvents:"none",zIndex:10}}>
            {view==="us"&&coverage[hovered]&&<><b>{SN[hovered]||hovered}</b>{" — "}{coverage[hovered].passed>0&&<span style={{color:"#27500A"}}>{coverage[hovered].passed} passed</span>}{coverage[hovered].passed>0&&coverage[hovered].proposed>0&&" · "}{coverage[hovered].proposed>0&&<span style={{color:"#7A4A0B"}}>{coverage[hovered].proposed} proposed</span>}</>}
            {view==="eu"&&EU_COUNTRIES[hovered]&&<><b>{EU_COUNTRIES[hovered].name}</b>{euBills.length>0?" — EU-wide regulation":""}</>}
          </div>
        )}
      </div>

      <div className="map-legend">
        <div className="map-legend-item"><div className="map-swatch" style={{background:"#B8DDA0",border:"1px solid #5A9A30"}}/> Passed</div>
        <div className="map-legend-item"><div className="map-swatch" style={{background:"#FDE8CC",border:"1px solid #C8A840"}}/> Proposed</div>
        <div className="map-legend-item"><div className="map-swatch" style={{background:"var(--surface2)",border:"1px solid var(--border)"}}/> No bills</div>
        {fedColor&&<div className="map-legend-item"><div className="map-swatch" style={{background:"none",border:"2px "+(fedDash?"dashed":"solid")+" "+fedColor}}/> Federal</div>}
      </div>
    </div>
  );
}

// ── Legislation section ────────────────────────────────────────
const STATE_NAMES = {US:"Federal",EU:"European Union",AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"Washington DC"};

function LegislationSec({ chem, showMap }) {
  const [filter, setFilter] = useState("all");
  const bills = (chem.legislation||[]).map((l,i)=>typeof l==="string"?{st:"—",bill:"",status:"proposed",title:l,id:i}:{...l,id:i});
  const filtered = filter==="all"?bills:bills.filter(b=>b.status===filter);
  const passed=bills.filter(b=>b.status==="passed").length;
  const proposed=bills.filter(b=>b.status==="proposed").length;
  const searchName=chem.name.split("(")[0].trim();

  return (
    <Sec id="legislation" label="Legislation & Regulatory Action">
      {showMap && <USLegMap legislation={bills}/>}
      <div className="leg-filters">
        {[["all",bills.length],["passed",passed],["proposed",proposed]].map(([f,ct])=>(
          <button key={f} className={`leg-filter${filter===f?" on":""}`} onClick={()=>setFilter(f)}>{f} ({ct})</button>
        ))}
      </div>
      <div className="leg-list">
        {filtered.map((b,i)=>{
          const isPassed=b.status==="passed";
          const isUS=b.st==="US",isEU=b.st==="EU";
          return (
            <div key={b.id} className="leg-item">
              <div className="leg-state" style={{background:isUS?"var(--accent-light)":isEU?"#EEEDFE":"var(--surface2)",color:isUS?"var(--accent)":isEU?"#534AB7":"var(--text-muted)",border:`1px solid ${isUS?"var(--accent-mid)":isEU?"#CECBF6":"var(--border)"}`}} title={STATE_NAMES[b.st]||b.st}>{b.st}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {b.bill&&<span className="leg-bill">{b.bill}</span>}
                  <span className="leg-status" style={{background:isPassed?"#EAF3DE":"var(--warn-light)",color:isPassed?"#27500A":"var(--warn)",border:`1px solid ${isPassed?"#C0DDA0":"var(--warn-border)"}`}}>{b.status}</span>
                </div>
                <div className="leg-title">{b.title}</div>
              </div>
            </div>
          );
        })}
        {filtered.length===0&&<div style={{padding:"20px",textAlign:"center",color:"var(--text-muted)",fontSize:13,fontFamily:"var(--mono)"}}>No {filter} legislation tracked.</div>}
      </div>
      <div className="leg-ext">
        <a className="ext-link primary" href={`https://www.saferstates.org/bill-tracker/?search=${encodeURIComponent(searchName)}`} target="_blank" rel="noopener noreferrer">Safer States tracker ↗</a>
        <a className="ext-link" href="https://www.saferstates.org/bill-tracker/" target="_blank" rel="noopener noreferrer">All bills ↗</a>
        <a className="ext-link" href={`https://www.congress.gov/search?q=%7B%22source%22%3A%22legislation%22%2C%22search%22%3A%22${encodeURIComponent(searchName)}%22%7D`} target="_blank" rel="noopener noreferrer">Congress.gov ↗</a>
      </div>
    </Sec>
  );
}

// ── Tweak defaults ─────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accentHue": "forest",
  "showMap": true
}/*EDITMODE-END*/;

const SCHEMES = {
  navy:  { accent:"#1A3A5C", accentLight:"#E8EEF5", accentMid:"#A8BDD4" },
  forest:{ accent:"#0A5E47", accentLight:"#E3F0EB", accentMid:"#C0DDD2" },
  slate: { accent:"#3D3D56", accentLight:"#EDEDF5", accentMid:"#C0C0D8" },
};

// ── Main App ───────────────────────────────────────────────────
function App() {
  const tweaks = TWEAK_DEFAULTS; const setTweak = () => {};
  const [query, setQuery] = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [showSug, setShowSug] = useState(false);
  const [activeChem, setActiveChem] = useState(null);
  const [aiData, setAiData] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);
  const sugRef = useRef(null);

  // Detect system dark/light preference and follow OS changes
  const [systemTheme, setSystemTheme] = useState(() => {
    if (typeof window === "undefined" || !window.matchMedia) return "light";
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = e => setSystemTheme(e.matches ? "dark" : "light");
    // addEventListener is modern; addListener is legacy fallback
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);

  // Apply theme + accent CSS vars (theme follows system)
  useEffect(() => {
    const r = document.documentElement.style;
    const s = SCHEMES[tweaks.accentHue] || SCHEMES.navy;
    r.setProperty("--accent", s.accent);
    r.setProperty("--accent-light", s.accentLight);
    r.setProperty("--accent-mid", s.accentMid);
    if (systemTheme === "dark") {
      r.setProperty("--bg","#111215"); r.setProperty("--surface","#1A1B1E");
      r.setProperty("--surface2","#22242A"); r.setProperty("--text","#E8E8EC");
      r.setProperty("--text-mid","#A8A8B2"); r.setProperty("--text-muted","#5A5A66");
      r.setProperty("--border","#2E3040");
      r.setProperty("--alt-bg","#1C2A1E"); r.setProperty("--alt-border","#2F4A33");
      r.setProperty("--alt-text","#A8D89A"); r.setProperty("--alt-source-bg","#172116");
    } else {
      r.setProperty("--bg","#F4F3EE"); r.setProperty("--surface","#FFFFFF");
      r.setProperty("--surface2","#ECEAE3"); r.setProperty("--text","#17171A");
      r.setProperty("--text-mid","#3D3D42"); r.setProperty("--text-muted","#7A7A82");
      r.setProperty("--border","#D8D6CE");
      r.setProperty("--alt-bg","#EEF7E8"); r.setProperty("--alt-border","#C8E4B0");
      r.setProperty("--alt-text","#1F5010"); r.setProperty("--alt-source-bg","#F5FBF0");
    }
  }, [systemTheme, tweaks.accentHue]);

  const DB = window.CURATED_DB || {};
  const ALIASES = window.ALIASES || {};
  const allEntries = useMemo(() => Object.values(DB), []);

  useEffect(() => {
    if (!query.trim()) { setSuggestions([]); return; }
    const q = query.toLowerCase();
    setSuggestions(allEntries.filter(c =>
      c.name.toLowerCase().includes(q) ||
      (c.aka||[]).some(a=>a.toLowerCase().includes(q)) ||
      (c.cas&&c.cas.toLowerCase().includes(q))
    ).slice(0,8));
  }, [query]);

  useEffect(() => {
    const h = e => { if (sugRef.current&&!sugRef.current.contains(e.target)&&!inputRef.current?.contains(e.target)) setShowSug(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);

  const lookupCurated = useCallback(name => {
    const key = ALIASES[name.toLowerCase()];
    return key ? DB[key] : null;
  }, []);

  const loadChemical = useCallback(async term => {
    setShowSug(false); setError(null);
    const curated = lookupCurated(term);
    if (curated) { setActiveChem(curated); setAiData(false); setQuery(curated.name); window.scrollTo({top:0,behavior:"smooth"}); return; }
    setLoading(true); setActiveChem(null); setAiData(false); setQuery(term);
    try {
      const resp = await window.claude.complete(`Toxicology expert. Return ONLY valid JSON (no markdown, no preamble) for chemical "${term}": {"name":"","aka":[],"cas":"","chemClass":{"name":"","def":""},"desc":"","formula":"","molWeight":"","toxicity":[{"label":"","val":""}],"gs":{"bm":1,"label":"Benchmark 1 — Avoid","detail":""},"parents":[],"children":[],"products":[],"func":"","legislation":[{"st":"","bill":"","status":"passed","title":""}],"links":[{"t":"","u":""}]}`);
      const parsed = JSON.parse(resp.replace(/```json|```/g,"").trim());
      setActiveChem({ ...parsed, structure:null }); setAiData(true);
    } catch(e) { setError(`Could not find data for "${term}". Try a different name or CAS number.`); }
    setLoading(false);
  }, [lookupCurated]);

  const reset = () => { setActiveChem(null); setAiData(false); setQuery(""); setError(null); setTimeout(()=>inputRef.current?.focus(),100); window.scrollTo({top:0,behavior:"smooth"}); };
  const c = activeChem;
  const featured = ["PFAS","PFOA","Formaldehyde","6PPD","BPA","Glyphosate","Vinyl chloride","Phthalates","DEHP","Flame retardants","Lead","Atrazine","TCE","Dioxins"];

  return (
    <div id="app-shell">
      {/* Header */}
      <header className="app-header">
        <button className="logo" onClick={reset}>
          <div className="logo-mark">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="7" cy="7" r="4.5" stroke="#fff" strokeWidth="1.8"/>
              <circle cx="12.5" cy="11.5" r="3" stroke="#fff" strokeWidth="1.4" opacity=".65"/>
              <line x1="11" y1="4.5" x2="8.5" y2="8.5" stroke="#fff" strokeWidth="1.4" opacity=".45"/>
            </svg>
          </div>
          <div>
            <div className="logo-name">Toxic Chemical Explorer</div>
            <div className="logo-sub">Hazards · Benchmarks · Legislation · Manufacturers</div>
          </div>
        </button>
        {c && <button className="back-btn" onClick={reset}>← New search</button>}
      </header>

      {/* Home */}
      {!c && !loading && (
        <div className="search-hero fade-up">
          <h2 className="hero-title">Know what's in your products.</h2>
          <p className="hero-sub">Search 206 toxic chemicals by name, CAS number, or class — health hazards, manufacturer data, and legislation in one place.</p>
          <div className="search-wrap">
            <svg className="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input ref={inputRef} className="search-input" type="text" placeholder="Chemical name, CAS number, or class…" value={query} autoFocus
              onChange={e=>{setQuery(e.target.value);setShowSug(true);}}
              onFocus={()=>setShowSug(true)}
              onKeyDown={e=>{if(e.key==="Enter"&&query.trim()) loadChemical(query.trim());}}
            />
            <button className="search-btn" onClick={()=>query.trim()&&loadChemical(query.trim())}>Search</button>
            {showSug && suggestions.length>0 && (
              <div className="autocomplete" ref={sugRef}>
                {suggestions.map((s,i) => (
                  <div key={i} className="autocomplete-item" onClick={()=>loadChemical(s.name)}>
                    <div>
                      <div className="ac-name">{s.name}</div>
                      {s.aka&&s.aka[0]&&<div className="ac-aka">{s.aka[0]}</div>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="quick-wrap">
            <div className="quick-label">Quick access</div>
            <div className="chips">{featured.map(n=><button key={n} className="chip" onClick={()=>loadChemical(n)}>{n}</button>)}</div>
          </div>
          <div className="stats-bar">
            <div style={{textAlign:"center"}}><span className="stat-num">206</span><div className="stat-lbl">chemicals &amp; elements</div></div>
            <div style={{textAlign:"center"}}><span className="stat-num">80</span><div className="stat-lbl">with manufacturer data</div></div>
            <div style={{textAlign:"center"}}><span className="stat-num">AI</span><div className="stat-lbl">lookup for unlisted</div></div>
          </div>
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="loading">
          <div style={{fontSize:15,color:"var(--text-mid)"}}>Researching <em>{query}</em>…</div>
          <div style={{fontSize:13,color:"var(--text-muted)",marginTop:6}}>Pulling toxicity data, benchmarks, and legislative context</div>
          <div className="loading-bar"/>
        </div>
      )}

      {/* Error */}
      {error && (
        <div className="error-box">
          <div style={{fontSize:14,color:"var(--danger)"}}>{error}</div>
          <button onClick={reset} style={{marginTop:12,fontSize:13,color:"var(--accent)",background:"none",border:"1px solid var(--accent)",borderRadius:6,padding:"6px 16px",cursor:"pointer"}}>Start over</button>
        </div>
      )}

      {/* Detail page */}
      {c && !loading && (
        <div className="detail-layout fade-up">

          {/* Sidebar */}
          <aside className="sidebar">
            <div>
              <div className="sb-name">{c.name}</div>
              {c.aka&&c.aka.length>0&&<div className="sb-aka">{c.aka.join(" · ")}</div>}
              <div className="sb-cas">CAS {c.cas}</div>
            </div>

            {/* GreenScreen badge */}
            {(() => {
              const s = GS[c.gs?.bm] || GS["U"];
              return (
                <div className="gs-big" style={{background:s.bg,border:`1px solid ${s.border}`}}>
                  <div className="gs-lbl" style={{color:s.color}}>{s.label} · GreenScreen™</div>
                  <div className="gs-title" style={{color:s.color}}>{s.title}</div>
                  <div className="gs-pips">
                    {[1,2,3,4].map(i=>(
                      <div key={i} className="gs-pip" style={{background:s.pips===0?"var(--border)":i<=s.pips?s.color:s.color+"28"}}/>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* Regulatory badges */}
            {(c.spwa||c.tfca||c.waPBT||c.cscpData?.count>0) && (
              <div>
                <div className="sb-section-lbl">Regulatory coverage</div>
                {c.spwa&&<a href="https://ecology.wa.gov/waste-toxics/reducing-toxic-chemicals/washingtons-toxics-in-products-laws/safer-products" target="_blank" rel="noopener noreferrer" className="reg-badge" style={{background:"#EBF3FA",border:"1px solid #B5D4F4",color:"#185FA5"}}><div className="reg-dot" style={{background:"#185FA5"}}/> WA Safer Products: {c.spwa}</a>}
                {c.tfca&&<a href="https://ecology.wa.gov/waste-toxics/reducing-toxic-chemicals/washingtons-toxics-in-products-laws/toxic-free-cosmetics-act" target="_blank" rel="noopener noreferrer" className="reg-badge" style={{background:"#EEEDFE",border:"1px solid #CECBF6",color:"#534AB7"}}><div className="reg-dot" style={{background:"#534AB7"}}/> Toxic-Free Cosmetics Act</a>}
                {c.waPBT&&<a href="https://ecology.wa.gov/waste-toxics/reducing-toxic-chemicals/addressing-priority-toxic-chemicals" target="_blank" rel="noopener noreferrer" className="reg-badge" style={{background:"var(--danger-light)",border:"1px solid var(--danger-border)",color:"var(--danger)"}}><div className="reg-dot" style={{background:"var(--danger)"}}/> WA PBT / Action Plan</a>}
                {c.cscpData?.count>0&&<a href={c.cscpData.searchUrl} target="_blank" rel="noopener noreferrer" className="reg-badge" style={{background:"#FEF3E8",border:"1px solid #F0C896",color:"#8A4A0A"}}><div className="reg-dot" style={{background:"#C87820"}}/> CA Cosmetics: {c.cscpData.count.toLocaleString()} products</a>}
              </div>
            )}

            <div className="sb-divider"/>

            {/* Page nav */}
            <div>
              <div className="sb-section-lbl">On this page</div>
              {[["overview","Overview"],["structure","Structure"],["hazards","Hazards"],["greenscreen","GreenScreen"],["products","Products"],
                ...(c.manufacturers?.length>0?[["manufacturers","Manufacturers"]]:[]),
                ...(c.saferAlternatives?.length>0?[["alternatives","Safer alternatives"]]:[]),
                ["legislation","Legislation"],["learn-more","Learn more"]
              ].map(([id,lbl]) => (
                <button key={id} className="nav-btn" onClick={()=>document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"})}>{lbl}</button>
              ))}
            </div>

            {/* Related chemicals */}
            {((c.parents?.length>0)||(c.children?.length>0)) && (
              <div>
                <div className="sb-divider"/>
                <div className="sb-section-lbl">Related</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {(c.parents||[]).map((p,i)=>{ const name=typeof p==="string"?p:p.label||p; const cl=lookupCurated(name); return <button key={i} className={`related-chip${cl?" link":""}`} onClick={()=>cl&&loadChemical(name)}>← {name}</button>; })}
                  {(c.children||[]).map((ch,i)=>{ const name=typeof ch==="string"?ch:ch.label||ch; return <button key={i} className="related-chip link" onClick={()=>loadChemical(name)}>{name} →</button>; })}
                </div>
              </div>
            )}
          </aside>

          {/* Main content */}
          <main className="main">
            {aiData && (
              <div className="ai-warn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>
                AI-generated data — verify with authoritative sources linked below.
              </div>
            )}

            {/* Overview */}
            <Sec id="overview" label="Chemical Class & Description">
              {c.chemClass&&<div className="class-pill">{c.chemClass.name}</div>}
              {c.chemClass&&<p className="body-text" style={{marginBottom:10}}>{c.chemClass.def}</p>}
              <p className="body-text">{c.desc}</p>
            </Sec>

            {/* Two-col: structure + hazards */}
            <div className="two-col">
              <Sec id="structure" label="Molecular Structure">
                <div className="mol-wrap">
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",minHeight:200}}>
                    <AnimatedMolecule structure={c.structure} width={240} height={170}/>
                  </div>
                  <div className="mol-formula">
                    {c.formula}{c.molWeight&&c.molWeight!=="Varies"&&c.molWeight!=="Polymer"?` — MW ${c.molWeight} g/mol`:c.molWeight?` — ${c.molWeight}`:""}
                  </div>
                </div>
              </Sec>

              <Sec id="hazards" label="Health & Ecological Hazards">
                <div className="hazard-list">
                  {(c.toxicity||[]).map((t,i) => <HazardRow key={i} label={t.label} val={t.val}/>)}
                </div>
              </Sec>
            </div>

            {/* GreenScreen */}
            <Sec id="greenscreen" label="GreenScreen Benchmark">
              <div className="gs-detail" style={{background:(GS[c.gs?.bm]||GS["U"]).bg,border:`1px solid ${(GS[c.gs?.bm]||GS["U"]).border}`}}>
                <p>{c.gs?.detail}</p>
                <a href="https://www.greenscreenchemicals.org/learn/full-greenscreen-method" target="_blank" rel="noopener noreferrer">Learn about GreenScreen benchmarks ↗</a>
              </div>
            </Sec>

            {/* Products */}
            <Sec id="products" label="Products & Function">
              {(c.products||[]).some(p=>typeof p==="object"&&p.status)&&(
                <div className="prod-legend">
                  <span style={{fontWeight:600,color:"var(--text)",fontFamily:"var(--mono)",fontSize:11}}>Status: </span>
                  {[["#F5DEDE","#D4A0A0","#791F1F","Banned"],["#FDE8CC","#D4B882","#7A4A0B","Partially restricted"],["#FFF3D6","#D4C882","#6B5A10","Abandoned by industry"],["var(--surface2)","var(--border)","var(--text-muted)","Active use"]].map(([bg,bd,tc,lbl])=>(
                    <span key={lbl} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontFamily:"var(--mono)"}}><span style={{width:10,height:10,borderRadius:3,background:bg,border:`1px solid ${bd}`}}/><span style={{color:tc}}>{lbl}</span></span>
                  ))}
                </div>
              )}
              <div className="prod-chips">
                {(c.products||[]).map((p,i)=>{ const isObj=typeof p==="object"&&p.name; const name=isObj?p.name:p; const st=isObj?p.status:null; const sty=st==="banned"?{background:"#F5DEDE",color:"#791F1F",border:"1px solid #D4A0A0"}:st==="partial"?{background:"#FDE8CC",color:"#7A4A0B",border:"1px solid #D4B882"}:st==="abandoned"?{background:"#FFF3D6",color:"#6B5A10",border:"1px solid #D4C882"}:{background:"var(--surface2)",color:"var(--text-mid)",border:"1px solid var(--border)"}; return <span key={i} className="prod-chip" title={isObj&&p.note?p.note:""} style={{...sty,cursor:isObj&&p.note?"help":"default"}}>{name}</span>; })}
              </div>
              {c.func&&<p className="body-text" style={{fontSize:14}}>{c.func}</p>}
              {c.cscpData?.count>0&&(
                <div style={{marginTop:14,padding:"10px 14px",borderRadius:8,background:"#FEF3E8",border:"1px solid #F0C896",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                  <div>
                    <span style={{fontFamily:"var(--mono)",fontSize:11,fontWeight:600,color:"#8A4A0A",textTransform:"uppercase",letterSpacing:"0.5px"}}>CA Safe Cosmetics Program</span>
                    <div style={{fontSize:13,color:"var(--text-mid)",marginTop:2}}>
                      Reported in <strong style={{color:"#6A3008"}}>{c.cscpData.count.toLocaleString()}</strong> cosmetic products
                      {c.cscpData.categories?.length>0&&<span style={{color:"var(--text-muted)"}}> · primarily {c.cscpData.categories.slice(0,3).join(", ")}</span>}
                    </div>
                    <div style={{fontSize:11,color:"var(--text-muted)",marginTop:3,fontFamily:"var(--mono)"}}>{c.cscpData.note}</div>
                  </div>
                  <a href={c.cscpData.searchUrl} target="_blank" rel="noopener noreferrer" style={{fontFamily:"var(--mono)",fontSize:11,fontWeight:600,color:"#8A4A0A",textDecoration:"none",padding:"5px 12px",borderRadius:6,border:"1px solid #F0C896",background:"#FDF0E0",whiteSpace:"nowrap",flexShrink:0}}>Search CSCP ↗</a>
                </div>
              )}
            </Sec>

            {/* Manufacturers */}
            {c.manufacturers?.length>0&&(
              <Sec id="manufacturers" label="Key Manufacturers & Polluters">
                <div className="mfr-table">
                  {c.manufacturers.map((m,i)=>(
                    <div key={i} className="mfr-row">
                      <div className="mfr-name">{m.name}</div>
                      <div className="mfr-note">{m.note}</div>
                    </div>
                  ))}
                  {c.triSearch&&(
                    <div className="mfr-links">
                      <a href={c.triSearch} target="_blank" rel="noopener noreferrer" className="ext-link primary">EPA TRI Toxics Tracker ↗</a>
                      <a href="https://pedp-ejscreen.azurewebsites.net/" target="_blank" rel="noopener noreferrer" className="ext-link">EJScreen mapping ↗</a>
                    </div>
                  )}
                </div>
              </Sec>
            )}

            {/* Safer alternatives */}
            {c.saferAlternatives?.length>0&&(
              <Sec id="alternatives" label="Safer Alternatives">
                <div className="alt-table">
                  {c.saferAlternatives.map((a,i)=>(
                    <div key={i} className="alt-row">
                      <div className="alt-ctx"><span style={{color:"#2D7D2A"}}>✓</span>{a.context}</div>
                      <div><div className="alt-name">{a.alt}</div><div className="alt-note">{a.note}</div></div>
                    </div>
                  ))}
                  {c.altSource&&<div className="alt-source">Source: {c.altSource}</div>}
                </div>
              </Sec>
            )}

            {/* Legislation */}
            <LegislationSec chem={c} showMap={tweaks.showMap}/>

            {/* Learn more */}
            <Sec id="learn-more" label="Learn More">
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {(c.links||[]).map((l,i)=>(
                  <a key={i} href={l.u||l.url} target="_blank" rel="noopener noreferrer" className="ext-link">{l.t||l.label} ↗</a>
                ))}
              </div>
            </Sec>
          </main>
        </div>
      )}

      <footer className="footer">
        Chemical data from curated database and AI-assisted research. Always verify with authoritative sources.<br/>
        GreenScreen benchmarks via <a href="https://www.greenscreenchemicals.org/" target="_blank" rel="noopener noreferrer">Clean Production Action</a>. Legislation via <a href="https://www.saferstates.org/bill-tracker/" target="_blank" rel="noopener noreferrer">Safer States</a>.
      </footer>

      </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
